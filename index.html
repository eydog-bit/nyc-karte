<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NYC">
<meta name="theme-color" content="#f4f2ec">
<meta name="robots" content="noindex, nofollow">
<title>NYC Reise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #aeaeb2; --line: rgba(60,60,67,.13); --fill: rgba(118,118,128,.12);
    --blue: #007aff; --green: #248a3d; --red: #d70015; --orange: #c93400;
    --glass: rgba(255,255,255,.6); --sheet: rgba(247,247,249,.8);
    --hi: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.55);
    --shadow: 0 10px 34px rgba(0,0,0,.13), 0 2px 6px rgba(0,0,0,.06);
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --top: calc(env(safe-area-inset-top, 0px) + 10px); --peek: 150px;
    font: 15px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f4f2ec; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  input, textarea, select { font-size: 16px; }
  a { color: var(--blue); text-decoration: none; }
  svg { flex: none; }
  [hidden] { display: none !important; }
  #map { position: fixed; inset: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  /* Glas: helle Kante oben wie Licht, das auf das Material fällt */
  .glass { background: var(--glass) linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%);
           -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); box-shadow: var(--hi), var(--shadow); }
  .press { transition: transform 160ms var(--ease-out); }
  .press:active { transform: scale(.96); }

  #filters::-webkit-scrollbar { display: none; }
  /* Tag: ein Knopf, das Menü klappt darunter auf wie ein iOS-Pull-down */
  #daybtn { position: fixed; z-index: 2; top: var(--top); left: 12px; display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px 0 16px;
            border-radius: 99px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  #daybtn svg { width: 14px; height: 14px; color: var(--ink2); }
  #daybtn.today::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  #daybtn.idle { color: var(--ink2); }
  #daybtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #dayback { position: fixed; inset: 0; z-index: 7; }
  #daymenu { position: fixed; z-index: 8; top: calc(var(--top) + 50px); left: 12px; width: min(300px, calc(100vw - 24px)); max-height: calc(100dvh - var(--top) - 62px);
             overflow-y: auto; overscroll-behavior: contain; border-radius: 15px;
             background: rgba(250,250,252,.8) linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 40%);
             -webkit-backdrop-filter: blur(44px) saturate(190%); backdrop-filter: blur(44px) saturate(190%);
             box-shadow: var(--hi), 0 22px 60px rgba(0,0,0,.2), 0 4px 14px rgba(0,0,0,.08);
             /* wächst aus der oberen linken Ecke des Knopfs (50px darüber) */
             transform-origin: 0 -50px; opacity: 0; transform: scale(.85); visibility: hidden;
             transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out), visibility 0s 180ms; }
  #daymenu.open { opacity: 1; transform: none; visibility: visible; transition: opacity 300ms var(--ease-drawer), transform 300ms var(--ease-drawer); }
  .mi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 50px; padding: 7px 16px 7px 12px; text-align: left; outline: none;
        background-clip: padding-box; filter: blur(4px); transition: filter 180ms var(--ease-out); }
  #daymenu.open .mi { filter: none; transition: filter 300ms var(--ease-drawer); }
  .mi + .mi { border-top: .5px solid var(--line); }
  .mi:nth-child(2) { border-top: 8px solid rgba(60,60,67,.08); }
  .mi:active, .mi:focus-visible { background-color: rgba(0,0,0,.07); }
  .ck { width: 18px; visibility: hidden; } .ck svg { width: 17px; height: 17px; }
  .mi[aria-checked="true"] .ck { visibility: visible; }
  .mi .t { flex: 1; min-width: 0; }
  .mi b, .mi small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mi b { font-weight: 600; letter-spacing: -.01em; }
  .mi small { font-size: 13px; color: var(--ink2); }
  .mi em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--blue); }
  .mi.past { color: var(--ink2); }
  @media (prefers-reduced-motion: reduce) { #daymenu { transform: none; } #daymenu .mi { filter: none; } }
  @media (prefers-reduced-transparency: reduce) { #daymenu { background: #f7f7f9; -webkit-backdrop-filter: none; backdrop-filter: none; } }

  .maplibregl-ctrl-top-right { top: calc(var(--top) - 10px); right: 2px; } /* MapLibre setzt 10px Rand: Knöpfe in einer Reihe mit dem Tag-Knopf */
  .ctl { display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; }
  .ctl button { display: grid; place-items: center; width: 44px; height: 44px; color: var(--ink); }
  .ctl button + button { border-top: .5px solid var(--line); }
  .ctl button[aria-pressed="true"] { color: var(--blue); }
  .ctl svg { width: 21px; height: 21px; }

  #sheet { position: fixed; z-index: 3; left: 8px; right: 8px; bottom: 8px; height: min(64dvh, 620px); display: flex; flex-direction: column;
           border-radius: 30px; background: var(--sheet) linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 30%);
           -webkit-backdrop-filter: blur(36px) saturate(190%); backdrop-filter: blur(36px) saturate(190%);
           box-shadow: var(--hi), 0 -2px 30px rgba(0,0,0,.14);
           transform: translateY(calc(100% - var(--peek))); transition: transform 500ms var(--ease-drawer); }
  #sheet.open { transform: none; }
  #grab { flex: none; touch-action: none; cursor: grab; padding: 8px 20px 2px; }
  #grab::before { content: ""; display: block; width: 36px; height: 5px; margin: 0 auto 10px; border-radius: 3px; background: rgba(60,60,67,.26); }
  h1 { font-size: 22px; line-height: 1.15; font-weight: 700; letter-spacing: -.022em; }
  #sub { margin-top: 3px; font-size: 13px; color: var(--ink2); }
  #filters { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 20px 14px; }
  .chip { flex: none; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; background: var(--fill);
          font-size: 13px; font-weight: 600; transition: opacity 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="false"] { opacity: .42; }
  .chip.tg[aria-pressed="false"] { opacity: 1; }
  .chip.tg[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip small { font-size: 12px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] small { color: rgba(255,255,255,.7); }
  /* Arten (Burger, Pizza, ...): zweite Leiste, nur wenn genau eine Kategorie aktiv ist */
  #kinds { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -6px; padding: 0 20px 14px;
           transition: opacity 220ms var(--ease-out), translate 220ms var(--ease-out); }
  #kinds::-webkit-scrollbar { display: none; }
  @starting-style { #kinds { opacity: 0; translate: 0 -6px; } }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .dot.ring { background: #fff; box-shadow: inset 0 0 0 2.5px currentColor; }
  .dot.ok { display: grid; place-items: center; width: 16px; height: 16px; background: #8e8e93; color: #fff; }
  .dot.ok svg { width: 11px; height: 11px; }

  #tools { flex: none; display: flex; gap: 8px; align-items: center; padding: 0 14px 10px; }
  .seg { flex: none; display: flex; padding: 2px; border-radius: 11px; background: var(--fill); }
  .seg button { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink2); transition: background-color 150ms ease, color 150ms ease; }
  .seg button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 11px; background: var(--fill); color: var(--ink2); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); }
  .search svg { width: 16px; height: 16px; }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 18px);
            border-top: .5px solid var(--line); }
  .sec { display: flex; align-items: center; gap: 7px; padding: 18px 10px 6px; font-size: 13px; font-weight: 700; letter-spacing: -.005em; }
  .sec small { font-weight: 600; color: var(--ink3); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border-radius: 14px; text-align: left; transition: background-color 120ms ease; }
  .row:active, .row.sel { background: rgba(0,0,0,.05); }
  .row .t { flex: 1; min-width: 0; }
  .row b, .row small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row b { font-weight: 600; letter-spacing: -.01em; }
  .row small { font-size: 13px; color: var(--ink2); }
  .row.done b { color: var(--ink2); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
  i.op { font-style: normal; color: var(--green); } i.cl { font-style: normal; color: var(--red); } i.soon { font-style: normal; color: var(--orange); }
  .tag { flex: none; padding: 3px 7px; border-radius: 7px; background: var(--fill); font-size: 11px; font-weight: 700; color: var(--ink2); }
  .tag.hot { background: rgba(255,149,0,.16); color: var(--orange); }
  .empty, .hint { padding: 16px 10px; color: var(--ink2); font-size: 14px; }
  .more { display: block; width: 100%; padding: 14px 10px; color: var(--blue); font-weight: 600; text-align: left; }

  .card { position: relative; margin: 12px 0 6px; padding: 16px; border-radius: 22px; background: #fff;
          box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
          transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out), filter 240ms var(--ease-out); }
  @starting-style { .card { opacity: 0; transform: translateY(8px) scale(.98); filter: blur(4px); } }
  .card .k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink2); }
  .card .k svg { width: 15px; height: 15px; }
  .card h2 { margin: 6px 40px 0 0; font-size: 21px; line-height: 1.18; letter-spacing: -.02em; }
  .card p { margin-top: 6px; font-size: 14px; color: var(--ink2); }
  .card .note { color: var(--ink); }
  .x { position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--ink2); }
  .x svg { width: 14px; height: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .badges:empty { display: none; }
  .badge { padding: 3px 8px; border-radius: 7px; background: var(--fill); font-size: 12px; font-weight: 600; color: var(--ink2); }
  .badge.hot { background: linear-gradient(135deg, #ff9500, #ff3b30); color: #fff; }
  .badge.me { background: rgba(0,122,255,.12); color: var(--blue); }
  .badge.ok { background: rgba(52,199,89,.16); color: var(--green); }
  details { margin-top: 4px; }
  summary { display: inline; cursor: pointer; color: var(--blue); font-size: 13px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .week { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin-top: 6px; font-size: 13px; color: var(--ink2); }
  .week .now { color: var(--ink); font-weight: 600; }
  .subway { display: grid; gap: 7px; margin-top: 12px; padding-top: 12px; border-top: .5px solid var(--line); font-size: 14px; }
  .subway div { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .subway span { margin-left: 4px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .subway small { margin-left: auto; padding-left: 8px; color: var(--ink2); white-space: nowrap; }
  .howto { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(0,122,255,.07); font-size: 14px; }
  .howto > b { display: block; font-size: 13px; color: var(--blue); }
  .howto p { margin-top: 4px; color: var(--ink); line-height: 1.5; }
  .howto .bul { width: 18px; height: 18px; font-size: 10px; vertical-align: -3px; }
  .howto a { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; }
  .bul { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px; border-radius: 14px;
         background: var(--blue); color: #fff; font-weight: 600; text-align: center; }
  .btn svg { width: 17px; height: 17px; }
  .btn.alt { background: rgba(0,122,255,.11); color: var(--blue); }
  .btn.on { background: rgba(52,199,89,.16); color: var(--green); }
  .edit { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-size: 14px; color: var(--ink2); }
  .edit label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .edit select { flex: 1; min-width: 0; height: 36px; padding: 0 8px; border: 0; border-radius: 10px; background: var(--fill); }
  .link { color: var(--blue); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .link.red { color: var(--red); }
  .mynote { display: block; width: 100%; margin-top: 10px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--fill); resize: none; outline: none; }

  .field { display: block; margin-top: 12px; }
  .field span { display: block; margin: 0 0 5px 2px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .field input, .field select, .field textarea { display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--fill); outline: none; resize: none; }
  .res { margin-top: 4px; }
  .resrow { display: block; width: 100%; padding: 9px 4px; border-bottom: .5px solid var(--line); text-align: left; }
  .resrow b, .resrow small { display: block; }
  .resrow small { font-size: 13px; color: var(--ink2); }
  .where { display: flex; align-items: center; gap: 6px; }
  .where svg { width: 15px; height: 15px; color: var(--red); }
  .chipbtn { display: inline-flex; align-items: center; gap: 6px; height: 34px; margin-top: 8px; padding: 0 12px; border-radius: 99px; background: rgba(0,122,255,.11); color: var(--blue); font-size: 14px; font-weight: 600; }
  .chipbtn svg { width: 15px; height: 15px; }

  .toggle { display: flex; align-items: center; gap: 12px; width: 100%; margin: 12px 0 4px; padding: 14px 16px; border-radius: 22px; background: #fff; text-align: left;
            box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06); }
  .toggle > svg { width: 24px; height: 24px; color: var(--blue); }
  .toggle span { flex: 1; } .toggle b, .toggle small { display: block; } .toggle small { font-size: 13px; color: var(--ink2); }
  .sw { flex: none; position: relative; width: 51px; height: 31px; border-radius: 99px; background: rgba(120,120,128,.16); transition: background-color 200ms ease; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
               box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform 250ms var(--ease-out); }
  [aria-pressed="true"] > .sw { background: #34c759; }
  [aria-pressed="true"] > .sw::after { transform: translateX(20px); }
  .group { border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .item { padding: 12px 14px; font-size: 14px; }
  .item + .item { border-top: .5px solid var(--line); }
  .item p { margin-top: 3px; color: var(--ink2); }
  .item a { display: inline-block; margin-top: 4px; font-size: 12px; }

  #toast { position: fixed; z-index: 6; left: 50%; top: calc(var(--top) + 50px); display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100vw - 32px);
           padding: 11px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
           transform: translate(-50%, -8px) scale(.97); transition: opacity 200ms ease, transform 220ms var(--ease-out); }
  #toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #toast button { color: var(--blue); font-weight: 700; }

  .me-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .me-dot::before { content: ""; position: absolute; inset: -16px; z-index: -1; border-radius: 50%; background: rgba(0,122,255,.2); animation: halo 2.6s var(--ease-out) infinite; }
  @keyframes halo { from { transform: scale(.35); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  .base { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; border: 2.5px solid #fff;
          box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; }
  .base svg { width: 19px; height: 19px; }
  .base span { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap;
               text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .pick { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--red); border: 3px solid #fff; transform: rotate(-45deg); box-shadow: 0 3px 10px rgba(0,0,0,.3); }

  @media (hover: hover) and (pointer: fine) {
    .row:hover { background: rgba(0,0,0,.035); }
    .ctl button:hover, #daybtn:hover { color: var(--blue); }
    .mi:hover { background-color: rgba(0,0,0,.04); }
  }
  @media (min-width: 900px) {
    #daybtn, #daymenu { left: 404px; }
    #filters, #kinds { flex-wrap: wrap; }
    #sheet { left: 16px; top: 16px; bottom: 16px; width: 372px; height: auto; transform: none !important; }
    #grab { cursor: default; padding-top: 18px; }
    #grab::before { display: none; }
    #toast { left: calc(50% + 194px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet, .chip, .press, .sw::after { transition: none; }
    .card { transition: opacity 200ms ease; }
    @starting-style { .card { transform: none; filter: none; } #kinds { translate: none; } }
    .me-dot::before { animation: none; opacity: .5; transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass, #sheet { background: #f7f7f9; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="daybtn" class="glass press" aria-haspopup="menu" aria-expanded="false" aria-controls="daymenu"><span id="daylbl"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></button>
<div id="dayback" hidden></div>
<div id="daymenu" role="menu" aria-label="Tag wählen"></div>
<section id="sheet">
  <div id="grab" role="button" tabindex="0" aria-label="Liste ein- oder ausklappen"><h1 id="title"></h1><p id="sub"></p></div>
  <div id="filters"></div>
  <div id="kinds" aria-label="Arten" hidden></div>
  <div id="tools">
    <div class="seg" role="tablist"><button role="tab" data-tab="orte">Orte</button><button role="tab" data-tab="weg">Unterwegs</button></div>
    <label class="search" id="qbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Orte suchen" enterkeyhint="search" autocomplete="off" aria-label="Orte suchen"></label>
  </div>
  <div id="scroll"></div>
</section>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="oh.js"></script>
<script src="subway.js"></script>
<script src="data.js"></script>
<script>
const CATS = {
  sehen:       { label: 'Sehenswert',         color: '#007aff' },
  foto:        { label: 'Fotospots',          color: '#32ade6' },
  essen:       { label: 'Essen',              color: '#ff9500' },
  suess:       { label: 'Süßes & Kaffee',     color: '#a2845e' },

// ---------- Zeit, Datum, Öffnungszeiten (immer New Yorker Ortszeit) ----------
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], DN = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const date = d => new Date(d + 'T12:00');

const long = d => `${short(d)}${date(d).getMonth() + 1}.`;

const fmtNY = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' });
function nyNow() {
  const p = Object.fromEntries(fmtNY.formatToParts(new Date()).map(x => [x.type, x.value]));
  return { d: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(p.weekday), m: (+p.hour % 24) * 60 + +p.minute };
}
let NOW = nyNow();
const hm = m => `${Math.floor(m / 60) % 24}:${String(m % 60).padStart(2, '0')}`;
function openInfo(p) {
  // Märkte mit Laufzeit: vorher "erst ab", danach "vorbei" (Datum in New Yorker Zeit)
  const ny = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
  if (p.from && ny < p.from) return { open: false, cls: 'cl', text: `Erst ab ${long(p.from)}` };
  if (p.to && ny > p.to) return { open: false, cls: 'cl', text: 'Vorbei' };
  let s; try { s = OH.status(p.oh, NOW); } catch { return null; }
  if (!s) return null;
  if (s.always) return { open: true, cls: 'op', text: 'Immer zugänglich' };
  if (s.open) return { open: true, cls: s.left <= 60 ? 'soon' : 'op', text: `Offen bis ${s.until === 0 ? '24:00' : hm(s.until)}` };
  if (!s.next) return { open: false, cls: 'cl', text: 'Geschlossen' };
  return { open: false, cls: 'cl', text: `Geschlossen · öffnet ${s.next.d === NOW.d ? '' : DN[s.next.d] + ' '}${hm(s.next.m)}` };
}

}

const HOTEL_ST = '21 St-Queensbridge';

  const list = p.id === 'hotel' && T.hotelStations ? T.hotelStations.map(([name, lines, min]) => ({ name, lines: lines.split(' '), min })) : stationsNear(p);

}
function howTo(p) {
  const h = byId.hotel, hs = SUB.stations.find(s => s[0] === HOTEL_ST);
  if (!h || !hs || p.cat === 'basis') return '';
  const lines = [];
  if (near()) { const d = dist(S.pos, p); lines.push(`Von euch: ${km(d)}${d < 2500 ? `, zu Fuß ca. ${walkMin(d)} Min.` : ''}`); }
  const w = dist(h, p);
  if (w < 1300) lines.push(`Vom Hotel zu Fuß ca. ${walkMin(w)} Min.`);
  else {
    const now = hotelLine(), other = now === 'M' ? 'F' : 'M';
    const at = stationsNear(p, 6).filter(s => s.d < 1000), find = l => at.find(s => s.lines.includes(l));
    const dir = s => s.lng < hs[2] ? 'Richtung Manhattan' : 'Richtung Queens';
    const leg = (l, s) => `${bullet(l)} ab ${HOTEL_ST} ${dir(s)} bis <b>${esc(s.name)}</b>, dann ${walkMin(s.d)} Min. zu Fuß`;
    const a = find(now), b = find(other), when = now === 'M' ? 'Abends und am Wochenende' : 'Werktags tagsüber';

}

let toastT;
function toast(msg, undo) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button>Rückgängig</button>' : '');
  t.classList.add('show');
  t.onclick = e => { if (undo && e.target.closest('button')) { undo(); t.classList.remove('show'); } };

const peek = () => { const f = $('kinds').hidden ? $('filters') : $('kinds'); return f.hidden ? $('grab').offsetHeight + 12 : f.offsetTop + f.offsetHeight; };
const setPeek = () => document.documentElement.style.setProperty('--peek', peek() + 'px');
function setOpen(v) {
  const changed = v !== S.open;
  S.open = v;
  $('sheet').style.transform = '';
  $('sheet').classList.toggle('open', v);
  if (changed && !S.sel && !userMoved && !desk()) fit();
}
const grab = $('grab');
let drag = null;
grab.onpointerdown = e => {
  if (desk() || drag) return;
  drag = { y0: e.clientY, y: e.clientY, t: e.timeStamp, v: 0, moved: false, base: S.open ? 0 : $('sheet').offsetHeight - peek() };
  grab.setPointerCapture(e.pointerId);
  $('sheet').style.transition = 'none';
};
grab.onpointermove = e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (Math.abs(dy) > 6) drag.moved = true;
  drag.v = (e.clientY - drag.y) / Math.max(1, e.timeStamp - drag.t) * 1000;
  drag.y = e.clientY; drag.t = e.timeStamp;
  const y = drag.base + dy;
  // über den oberen Rand hinaus mit Gummiband statt hartem Stopp
  if (drag.moved) $('sheet').style.transform = `translateY(${y < 0 ? -Math.sqrt(-y) * 2 : y}px)`;
};
grab.onpointerup = grab.onpointercancel = e => {
  if (!drag) return;
  const v = e.timeStamp - drag.t > 80 ? 0 : drag.v;
  // Ziel aus Position plus Schwung (Apple-Projektion, Verzögerung 0.998), dann zum näheren Zustand.
  const end = drag.base + (e.clientY - drag.y0) + v * 0.499;
  $('sheet').style.transition = '';
  setOpen(drag.moved ? end < ($('sheet').offsetHeight - peek()) / 2 : !S.open);
  drag = null;
};
grab.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(!S.open); } };

function listView() {
  const L = places.filter(p => (p.main || S.q || S.kind) && visible(p));

    // Nach Entfernung, sonst erst die verplanten Orte nach Tag, dann der Rest alphabetisch, Filialen nach den Hauptorten.
    const g = near() ? L.map(p => [dist(S.pos, p), p]).sort((a, b) => a[0] - b[0]).map(([, p]) => p)
      : L.sort((a, b) => (dayOf(a) || 'z').localeCompare(dayOf(b) || 'z') || !a.main - !b.main || a.name.localeCompare(b.name, 'de'));

  }
  if (S.nearby && near()) {

    <label class="field"><span>Kategorie</span><select id="f-cat">${ORDER.map(c => `<option value="${c}"${c === f.cat ? ' selected' : ''}>${CATS[c].label}</option>`).join('')}</select></label>
    <label class="field" id="f-kind-l"><span>Art</span><select id="f-kind"></select></label>
    <label class="field"><span>Tag</span><select id="f-day">${dayOptions(f.day)}</select></label>
    <label class="field"><span>Notiz</span><textarea id="f-note" rows="2">${esc(f.note)}</textarea></label>
    <div class="actions"><button class="btn press" data-act="f-save">Sichern</button><button class="btn alt press" data-act="cancel">Abbrechen</button></div>
    <p class="hint">Tipp: Lange auf die Karte drücken setzt den Punkt genau dort.</p></article>`;
  showWhere(); kindField(f.cat, f.kind);
  if (f.lat != null) placePick(f);
  setOpen(true); $('scroll').scrollTop = 0;
}
// Art passend zur Kategorie, ausgeblendet bei Kategorien ohne Arten.
function kindField(cat, sel) {
  const K = KINDS[cat];
  $('f-kind-l').hidden = !K;
  $('f-kind').innerHTML = '<option value="">Keine Angabe</option>'
    + Object.entries(K || {}).map(([k, t]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(t)}</option>`).join('');
}
function showWhere() {
  const f = S.form;
  $('f-where').innerHTML = f.lat != null ? `${I.pin}<span>${esc(f.addr || 'Gewählter Punkt')}${f.hood ? ' · ' + esc(f.hood) : ''}</span>` : '<span>Noch kein Punkt gewählt</span>';
}
function placePick(f) { (pickMarker ||= new maplibregl.Marker({ element: pickEl(), anchor: 'bottom' })).setLngLat([f.lng, f.lat]).addTo(map); }
function setWhere(x, fly = true) {
  const f = S.form;
  Object.assign(f, { lat: x.lat, lng: x.lng, addr: x.addr || f.addr, hood: x.hood || '' });
  if (x.name && !$('f-name').value.trim()) $('f-name').value = x.name;
  $('f-res').innerHTML = ''; $('f-q').value = '';
  showWhere(); placePick(f);
  if (fly) focusOn(f, false);
}
function closeForm() { S.form = null; pickMarker?.remove(); render(); }
function saveForm() {
  const f = S.form, name = $('f-name').value.trim();
  if (!name) { toast('Bitte einen Namen eingeben.'); return $('f-name').focus(); }
  if (f.lat == null) return toast('Bitte einen Ort suchen oder lange auf die Karte drücken.');
  const p = { id: f.id || 'eigen-' + Date.now().toString(36), name, main: true, cat: $('f-cat').value, kind: $('f-kind').value, by: 'me',
              addr: f.addr === 'Gewählter Punkt' || f.addr === 'Mein Standort' ? '' : f.addr || '', hood: f.hood || '',
              lat: +(+f.lat).toFixed(5), lng: +(+f.lng).toFixed(5), note: $('f-note').value.trim(), day: $('f-day').value };
  p.group = p.id;
  const i = U.custom.findIndex(q => q.id === p.id);
  i >= 0 ? U.custom[i] = p : U.custom.push(p);
  if (U.edits[p.id]) delete U.edits[p.id].day;
  save(); rebuild();
  S.form = null; pickMarker?.remove();
  S.cats.add(p.cat); S.q = $('q').value = '';
  if (S.kind && p.kind !== S.kind) S.kind = null;
  if (!visible(p)) S.day = 'alle';
  toast(i >= 0 ? 'Gesichert' : 'Ort hinzugefügt');
  select(p.id);
}

// Ortssuche über Photon (OpenStreetMap), auf New York begrenzt.
const PHOTON = 'https://photon.komoot.io';
const fromPhoton = f => { const r = f.properties, street = [r.housenumber, r.street].filter(Boolean).join(' ');
  return { name: r.name || street, addr: street || r.name || '', hood: r.district || r.locality || r.city || '', lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }; };
let gT, gCtl;
$('scroll').addEventListener('input', e => {
  if (e.target.id !== 'f-q') return;
  clearTimeout(gT);
  const q = e.target.value.trim();
  if (q.length < 3) { $('f-res').innerHTML = ''; return; }
  gT = setTimeout(async () => {
    gCtl?.abort(); gCtl = new AbortController();
    try {
      const r = await fetch(`${PHOTON}/api/?q=${encodeURIComponent(q)}&lat=40.73&lon=-73.95&limit=6&lang=en&bbox=-74.27,40.49,-73.68,40.92`, { signal: gCtl.signal });
      S.form.res = (await r.json()).features.map(fromPhoton);
      $('f-res').innerHTML = S.form.res.map((x, i) => `<button class="resrow" data-act="f-pick" data-i="${i}"><b>${esc(x.name)}</b><small>${esc([x.addr !== x.name && x.addr, x.hood].filter(Boolean).join(' · '))}</small></button>`).join('')
        || '<p class="hint">Nichts gefunden.</p>';
    } catch (err) { if (err.name !== 'AbortError' && S.form) $('f-res').innerHTML = '<p class="hint">Suche gerade nicht erreichbar.</p>'; }
  }, 300);
});
async function reverse(ll) {
  try {
    const r = await fetch(`${PHOTON}/reverse?lat=${ll.lat}&lon=${ll.lng}&lang=en`);
    const f = (await r.json()).features?.[0];
    if (f && S.form && S.form.lat === ll.lat) { const x = fromPhoton(f); Object.assign(S.form, { addr: x.addr, hood: x.hood }); showWhere(); }
  } catch {}
}

addEventListener('resize', setPeek);
setInterval(() => { if (!S.form && !document.hidden && !document.activeElement?.matches('textarea, select')) render(); }, 60000);
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
